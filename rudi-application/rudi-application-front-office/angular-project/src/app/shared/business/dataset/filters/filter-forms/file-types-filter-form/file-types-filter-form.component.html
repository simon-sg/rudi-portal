@if (formGroup) {
  <form [formGroup]="formGroup" class="filter-child">
    <div class="filter-child-form">
      <ul [class]="ulClass" [formArrayName]="formArrayName">
        @for (fileType of items; track fileType; let i = $index) {
          <li [formGroupName]="i">
            <mat-checkbox
              [checked]="isChecked(fileType)"
              [value]="fileType.value"
              class="rudi-checkbox"
              formControlName="checked"
              >{{fileType.value}} ({{ counts[fileType.value] }})
            </mat-checkbox>
          </li>
        }
      </ul>
    </div>
    <div class="rudi-select-panel-footer">
      <button
        color="primary"
        (click)="submitForm()"
        class="rudi-blue-button"
        mat-raised-button
        type="submit"
        [disabled]="!submitIsEnabled"
        >
        {{'common.appliquer'| translate }}
      </button>
    </div>
  </form>
} @else {
  <div class="filter-child p-2">{{ 'common.loaderDescription' | translate }}</div>
}
