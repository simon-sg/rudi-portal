@if (formGroup) {
  <input
    type="text"
    class="filter-search-input"
    [(ngModel)]="searchText"
    [placeholder]="'filterBox.rechercherProducteur' | translate"
    />
  <form [formGroup]="formGroup" class="filter-child">
    <div class="filter-child-form">
      <ul [class]="ulClass" [formArrayName]="formArrayName">
        @for (producer of filteredItems; track producer.item) {
          <li [formGroupName]="producer.index">
            <mat-checkbox
              [checked]="isChecked(producer.item)"
              [value]="producer.item.value"
              class="rudi-checkbox"
              formControlName="checked"
              >{{producer.item.value}}
            </mat-checkbox>
          </li>
        }
      </ul>
    </div>
    <div class="rudi-select-panel-footer">
      <button
        color="primary"
        (click)="submitForm()"
        class="rudi-blue-button"
        mat-raised-button
        type="submit"
        [disabled]="!submitIsEnabled"
        >
        {{'common.appliquer'| translate }}
      </button>
    </div>
  </form>
}
