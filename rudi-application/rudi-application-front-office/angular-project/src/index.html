<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Rudi</title>
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;0,800;1,300;1,400;1,600;1,700;1,800&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        /* Masque la page tant que le CSS de personnalisation (customization.json > overrideCssFile)
           n'est pas résolu, pour éviter un flash des couleurs Rudi natives avant les couleurs
           personnalisées. Levé par le script ci-dessous, avec un filet de sécurité 3000 ms. */
        html.rudi-customization-pending {
            visibility: hidden;
        }
    </style>
</head>
<body class="mat-typography">
<script>
    (function () {
        var root = document.documentElement;
        root.classList.add('rudi-customization-pending');

        var revealed = false;
        function reveal() {
            if (revealed) {
                return;
            }
            revealed = true;
            root.classList.remove('rudi-customization-pending');
        }

        // Ne jamais bloquer l'affichage indéfiniment si Konsult est lent ou indisponible.
        // 500 ms s'est révélé trop court : /konsult/v1/customizations peut prendre jusqu'à ~2.3 s
        // (mesuré), ce qui faisait quand même apparaître le flash malgré ce garde-fou.
        var safetyTimeout = setTimeout(reveal, 3000);

        fetch('/konsult/v1/customizations?lang=fr')
            .then(function (response) { return response.ok ? response.json() : null; })
            .then(function (description) {
                var overrideCssFile = description && description.override_css_file;
                if (!overrideCssFile) {
                    return null;
                }
                return new Promise(function (resolve) {
                    var link = document.createElement('link');
                    link.rel = 'stylesheet';
                    link.href = '/konsult/v1/customizations/resources/' + encodeURIComponent(overrideCssFile);
                    link.onload = resolve;
                    link.onerror = resolve;
                    document.head.appendChild(link);
                });
            })
            .catch(function () {})
            .then(function () {
                clearTimeout(safetyTimeout);
                reveal();
            });
    })();
</script>
<app-root></app-root>
</body>
</html>
